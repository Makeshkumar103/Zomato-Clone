<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Zomato Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="auth-overlay">
        <form class="auth-form" action="#">
            <h1>Sign up</h1>
            <a href="/index.html"><button type="button" class="close-btn">&times;</button></a>

            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email">

            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to Zomato's <span>Terms of Service</span>, <span>Privacy Policy</span> and <span>Content Policies</span></label>
            </div>

            <button type="button" class="btn-primary">Create account</button>

            <fieldset>
                <legend>Or</legend>
            </fieldset>

            <button type="button" class="btn-secondary">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>

            <p class="auth-footer">
                Already have an account? <a href="/login.html">Log in</a>
            </p>
        </form>
    </div>
</body>
</html>
